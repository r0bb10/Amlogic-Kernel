name: Build Debian Image

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board to restore (TX3 Mini is hardware-unverified; no eMMC installer)
        type: choice
        options:
          - x96-max-plus
          - tx3-mini
        default: x96-max-plus
      kernel_version:
        description: Published kernel version (empty selects latest release)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: debian-image-${{ inputs.board || 'x96-max-plus' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.kernel.outputs.version }}
    steps:
      - name: Resolve published kernel
        id: kernel
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_INPUT: ${{ inputs.kernel_version }}
          BOARD: ${{ inputs.board || 'x96-max-plus' }}
        run: |
          set -euo pipefail
          case "$BOARD" in
            x96-max-plus) family=sm1 ;;
            tx3-mini) family=gxl ;;
            *) exit 1 ;;
          esac
          args=()
          if [ -n "$KERNEL_INPUT" ]; then
            [[ "$KERNEL_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            args=("$KERNEL_INPUT")
          fi
          gh release view "${args[@]}" --repo "$GITHUB_REPOSITORY" --json tagName,assets > release.json
          version=$(jq -er '.tagName' release.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          jq -e --arg name "linux-image-$version-$family.deb" \
            'if any(.assets[]; .name == $name) then true else error("kernel package not published: " + $name) end' release.json >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build and validate Debian image
        id: image
        env:
          KERNEL_VERSION: ${{ needs.resolve.outputs.version }}
          BOARD: ${{ inputs.board || 'x96-max-plus' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Privileged access is required for loop devices and chroot bind mounts.
          # Only trusted repository code runs here; no upstream-run artifacts execute.
          docker run --rm --privileged \
            --volume /dev:/dev \
            --volume "$GITHUB_OUTPUT:/step-output" \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env KERNEL_VERSION --env BOARD --env GH_TOKEN --env KERNEL_REPOSITORY="$GITHUB_REPOSITORY" \
            debian:trixie bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl debootstrap jq util-linux dosfstools e2fsprogs parted rsync python3 initramfs-tools-core zstd
              export OUTPUT="/workspace/out/dist/debian-trixie-${BOARD}-${KERNEL_VERSION}.img"
              tools/build-debian-image.sh
              debian_version=$(cat "out/.work/debian-image-build-${BOARD}/rootfs/etc/debian_version")
              [[ "$debian_version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || exit 1
              artifact="debian-trixie-${debian_version}-${BOARD}-image-kernel-${KERNEL_VERSION}"
              echo "artifact=$artifact" >> /step-output
              mkdir -p artifacts
              zstd -T0 -6 "$OUTPUT" -o "artifacts/$artifact.img.zst"
              cd artifacts
              sha256sum "$artifact.img.zst" > "$artifact.img.zst.sha256"
              chmod a+r *.img.zst *.sha256
            '
      - name: Upload validated image and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.image.outputs.artifact }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
