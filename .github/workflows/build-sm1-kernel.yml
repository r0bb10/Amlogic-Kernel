name: Build Amlogic Kernels

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace existing release assets
        type: boolean
        default: false

permissions:
  contents: write

env:
  KERNEL_SERIES: "7.2"
  KERNEL_URL: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git

concurrency:
  group: sm1-kernel
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.detect.outputs.build }}
      kernel_version: ${{ steps.detect.outputs.kernel_version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Resolve the latest upstream stable tag
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          set -euo pipefail

          kernel_tag="$(
            git ls-remote --tags --refs "$KERNEL_URL" "v${KERNEL_SERIES}.*" |
              cut -f2 |
              cut -d/ -f3 |
              grep -E "^v${KERNEL_SERIES//./\.}\.[0-9]+$" |
              sort -V |
              tail -n1
          )"
          if [ -z "$kernel_tag" ]; then
            echo "FATAL: no v${KERNEL_SERIES}.* tag found" >&2
            exit 1
          fi

          kernel_version="${kernel_tag#v}"
          release_tag="${kernel_version}"
          printf 'kernel_version=%s\nrelease_tag=%s\n' "$kernel_version" "$release_tag" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_INPUT" != true ] && \
            gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets > release.json && \
            jq -e --arg sm1 "linux-image-$kernel_version-sm1.deb" \
              --arg gxl "linux-image-$kernel_version-gxl.deb" \
              'any(.assets[]; .name == $sm1) and any(.assets[]; .name == $gxl)' release.json >/dev/null; then
            echo "::notice:: ${release_tag} already contains both kernel packages; nothing to do."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        family: [sm1, gxl]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Linux Git objects
        uses: actions/cache@v5
        with:
          path: source/.git
          # Keep one reusable shallow object store for this kernel series.
          # build.sh fetches the requested tag and recreates the worktree.
          key: linux-stable-git-${{ runner.arch }}-${{ env.KERNEL_SERIES }}-v1

      - name: Restore completed package
        id: package-cache
        uses: actions/cache/restore@v5
        with:
          path: artifacts
          key: ${{ matrix.family }}-package-${{ runner.arch }}-${{ needs.resolve.outputs.kernel_version }}-${{ hashFiles('build.sh', 'configs/sm1.config', 'patches/*.patch') }}

      - name: Build native ARM64 kernel package
        if: steps.package-cache.outputs.cache-hit != 'true'
        env:
          KERNEL_VERSION: ${{ needs.resolve.outputs.kernel_version }}
          KERNEL_FAMILY: ${{ matrix.family }}
        run: |
          docker run --rm \
            --platform linux/arm64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env KERNEL_VERSION --env KERNEL_FAMILY \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq bc bison build-essential ca-certificates flex git libelf-dev libssl-dev openssl perl python3 dpkg-dev
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/source
              CROSS_COMPILE="" ./build.sh
              mkdir -p artifacts
              cp "out/linux-image-${KERNEL_VERSION}-${KERNEL_FAMILY}.deb" artifacts/
              chmod -R a+rX artifacts
            '

      - name: Cache completed package
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: artifacts
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Upload kernel package
        uses: actions/upload-artifact@v7
        with:
          name: linux-image-${{ needs.resolve.outputs.kernel_version }}-${{ matrix.family }}.deb
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  validate:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        family: [sm1, gxl]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v8
        with:
          name: linux-image-${{ needs.resolve.outputs.kernel_version }}-${{ matrix.family }}.deb
          path: artifacts

      - name: Validate kernel payload
        env:
          KERNEL_VERSION: ${{ needs.resolve.outputs.kernel_version }}
          KERNEL_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          package="artifacts/linux-image-${KERNEL_VERSION}-${KERNEL_FAMILY}.deb"
          release="${KERNEL_VERSION}-${KERNEL_FAMILY}"
          case "$KERNEL_FAMILY" in
            sm1) dtb=meson-sm1-x96-max-plus.dtb ;;
            gxl) dtb=meson-gxl-s905w-tx3-mini.dtb ;;
            *) exit 1 ;;
          esac
          root="$(mktemp -d)"
          control="$(mktemp -d)"
          trap 'rm -rf "$root" "$control"' EXIT

          dpkg-deb --extract "$package" "$root"
          dpkg-deb --control "$package" "$control"

          image_dir="$root/usr/lib/linux-image-$KERNEL_FAMILY/$release"
          test -s "$image_dir/zImage"
          test -s "$image_dir/$dtb"
          test -s "$image_dir/config-$release"
          test -d "$root/lib/modules/$release"
          grep -qx "Package: linux-image-$KERNEL_FAMILY" "$control/control"
          grep -qx "Version: $release" "$control/control"

          config="$image_dir/config-$release"
          grep -qx "CONFIG_LOCALVERSION=\"-$KERNEL_FAMILY\"" "$config"
          sh -n "$control/postinst" "$control/postrm"
          grep -Fq "/boot/dtb/amlogic/$dtb" "$control/postinst"
          python3 - "$image_dir/zImage" "$KERNEL_FAMILY" <<'PY'
          import struct, sys
          with open(sys.argv[1], 'rb') as f:
              header = f.read(64)
          assert header[56:60] == b'ARM\x64', 'not a raw ARM64 Image'
          if sys.argv[2] == 'gxl':
              assert struct.unpack_from('<Q', header, 8)[0] == 0x01080000, 'missing legacy Amlogic Image load offset'
          PY
          for option in \
            CONFIG_ARCH_MESON=y \
            '# CONFIG_ARCH_SUNXI is not set' \
            '# CONFIG_ARCH_ROCKCHIP is not set' \
            CONFIG_MMC_MESON_GX=y \
            CONFIG_SERIAL_MESON_CONSOLE=y \
            CONFIG_DWMAC_MESON=y \
            CONFIG_ATH10K_SDIO=m \
            CONFIG_RD_ZSTD=y; do
            grep -qx "$option" "$config"
          done
          if [ "$KERNEL_FAMILY" = gxl ]; then
            grep -Fq 'mkimage -A arm64 ' "$control/postinst"
            grep -qx 'CONFIG_SSV6051=m' "$config"
            module="$root/lib/modules/$release/kernel/drivers/net/wireless/ssv6051/ssv6051.ko"
            test -s "$module"
            grep -aFq 'sdio:c*v3030d3030*' "$module"
            for option in CONFIG_MESON_GXL_PHY=y CONFIG_PINCTRL_MESON_GXL=y \
              CONFIG_COMMON_CLK_GXBB=y CONFIG_PHY_MESON_GXL_USB2=y \
              CONFIG_ARM_SCPI_PROTOCOL=y CONFIG_ARM_SCPI_CPUFREQ=y; do
              grep -qx "$option" "$config"
            done
          fi

  publish:
    needs: [resolve, build, validate]
    if: needs.resolve.outputs.build == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: sm1-kernel-release-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Download validated package
        uses: actions/download-artifact@v8
        with:
          pattern: linux-image-${{ needs.resolve.outputs.kernel_version }}-*.deb
          merge-multiple: true
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ needs.resolve.outputs.kernel_version }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes" <<EOF
          Upstream Linux ${KERNEL_VERSION} for Amlogic ARM64 TV boxes.

          - Source: ${KERNEL_URL} tag v${KERNEL_VERSION}
          - Architecture: ARM64
          - SM1: AMedia X96 Max Plus / S905X3, linux-image-${KERNEL_VERSION}-sm1.deb
          - GXL: Tanix TX3 Mini / S905W, linux-image-${KERNEL_VERSION}-gxl.deb (hardware testing pending)
          - Build verification: package contents, board DTBs, and required platform configuration symbols
          - Install only the package for your board; recovery images are manual Actions artifacts, not release assets.
          EOF

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes"
          fi
          for family in sm1 gxl; do
            test -s "artifacts/linux-image-${KERNEL_VERSION}-${family}.deb"
          done
          gh release upload "$RELEASE_TAG" artifacts/*.deb --repo "$GITHUB_REPOSITORY" --clobber
